<!DOCTYPE html>
<html lang="ur" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CampusSphere - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      content: [],
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    .post-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .post-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }
    .nav-link {
      transition: all 0.2s ease;
    }
    .nav-link:hover {
      transform: translateX(8px);
    }
    .sidebar-mobile {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 40;
      display: none;
    }
    .sidebar-mobile.active {
      display: block;
    }
    .sidebar-mobile.active + .sidebar {
      transform: translateX(0);
    }
  </style>
  
  <script>
    function toggleSidebar() {
      const overlay = document.getElementById('sidebarOverlay');
      const sidebar = document.querySelector('.w-64');
      overlay.classList.toggle('active');
      sidebar.classList.toggle('translate-x-0');
    }
    
    function closeSidebar() {
      const overlay = document.getElementById('sidebarOverlay');
      const sidebar = document.querySelector('.w-64');
      overlay.classList.remove('active');
      sidebar.classList.add('-translate-x-full');
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen overflow-x-hidden">

  <!-- Mobile Header -->
  <div class="md:hidden fixed top-0 left-0 right-0 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-3 z-50 flex items-center justify-between">
    <h1 class="text-xl font-bold text-blue-600">CampusSphere</h1>
    <button onclick="toggleSidebar()" class="text-2xl">
      <i class="fas fa-bars"></i>
    </button>
  </div>

  <!-- Mobile Overlay -->
  <div id="sidebarOverlay" class="sidebar-mobile" onclick="closeSidebar()"></div>
  
  <!-- LEFT SIDEBAR -->
  <div class="w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 fixed h-screen overflow-y-auto hidden md:block z-30">
    <div class="p-4">
      <h1 class="text-3xl font-bold text-blue-600 mb-8 px-4">CampusSphere</h1>
      <div class="px-4 mb-8">
        <div class="bg-slate-100 dark:bg-slate-800 rounded-3xl p-4">
          <img id="sidebarProfile" class="w-16 h-16 rounded-2xl object-cover mb-3" src="">
          <h2 id="sidebarName" class="font-bold text-lg"></h2>
          <p id="sidebarUsername" class="text-slate-500"></p>
        </div>
      </div>
      
      <nav class="space-y-2">
        <a href="home.html" class="flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 font-medium bg-blue-50 dark:bg-slate-800 text-blue-600">
          <i class="fa-solid fa-house text-xl"></i><span>Home</span>
        </a>
        <a href="explore.html" class="flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 font-medium">
          <i class="fa-solid fa-magnifying-glass text-xl"></i><span>Explore</span>
        </a>
        <div class="mt-4">
          <button onclick="showSuggestedFriendsModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-2xl font-medium flex items-center justify-center gap-2">
            <i class="fa-solid fa-user-plus"></i> View Suggested Friends
          </button>
        </div>
        <a href="notifications.html" class="flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 font-medium relative">
          <i class="fa-solid fa-bell text-xl"></i><span>Notifications</span>
          <span id="notif-count" class="ml-auto bg-red-500 text-white text-xs px-2 py-1 rounded-full hidden">0</span>
        </a>
        <a href="messages.html" class="flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 font-medium">
          <i class="fa-solid fa-envelope text-xl"></i><span>Messages</span>
        </a>
        <a href="profile.html" class="flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 font-medium">
          <i class="fa-solid fa-user text-xl"></i><span>Profile</span>
        </a>
        <a href="saved.html" class="flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 font-medium">
          <i class="fa-solid fa-bookmark text-xl"></i><span>Saved Posts</span>
        </a>
        <button onclick="logout()" class="flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-red-100 dark:hover:bg-red-900 font-medium text-red-500 w-full text-left">
          <i class="fa-solid fa-right-from-bracket text-xl"></i><span>Logout</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="w-full md:ml-64 pt-16 md:pt-0">
    <div class="max-w-2xl mx-auto py-4 sm:py-8 px-3 sm:px-4">

      <!-- Create Post Box -->
      <div class="bg-white dark:bg-slate-900 rounded-2xl sm:rounded-3xl shadow-sm p-3 sm:p-5 mb-6 mt-4">
        <div class="flex gap-2 sm:gap-4">
          <img id="currentUserImage" src="" class="w-10 sm:w-12 h-10 sm:h-12 rounded-xl sm:rounded-2xl" alt="">
          <textarea id="postInput" rows="2" 
                    class="flex-1 bg-slate-100 dark:bg-slate-800 rounded-2xl sm:rounded-3xl p-3 sm:p-4 outline-none resize-none text-sm sm:text-base" 
                    placeholder="What's on your mind?"></textarea>
        </div>
        
        <div id="previewArea" class="hidden mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3"></div>

        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 sm:gap-0 mt-4 border-t border-slate-200 dark:border-slate-700 pt-4">
          <div class="flex gap-3 sm:gap-6 text-slate-500 w-full sm:w-auto">
            <label class="cursor-pointer hover:text-blue-600 transition flex items-center gap-2">
              <i class="fa-solid fa-image text-xl"></i>
              <span class="text-sm">Photo</span>
              <input type="file" id="photoUpload" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
            </label>
          </div>
          
          <button onclick="createPost()" id="createPostBtn"
                  class="bg-blue-600 hover:bg-blue-700 px-8 py-2.5 rounded-2xl text-white font-medium">
            Post
          </button>
        </div>
      </div>

      <!-- Feed -->
      <div id="postsContainer" class="space-y-6"></div>
    </div>
  </div>

  <!-- SUGGESTED FRIENDS MODAL -->
  <div id="suggestedFriendsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-2xl w-full max-h-96 flex flex-col">
      <div class="p-6 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
        <h3 class="font-bold text-xl flex items-center gap-2">
          <i class="fa-solid fa-users"></i> Suggested Friends
        </h3>
        <button onclick="closeSuggestedFriendsModal()" class="text-2xl text-slate-500 hover:text-slate-700">
          <i class="fa-solid fa-times"></i>
        </button>
      </div>
      <div id="suggestedFriendsContainer" class="flex-1 overflow-y-auto p-6 space-y-4 grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </div>
  </div>

  <script>
    // ======================================
    // API CONFIGURATION
    // ======================================
    const API_URL = window.location.origin + '/social-site/backend/api';
    
    // Get token
    const token = localStorage.getItem("token");
    if (!token) {
      alert("Please Login First!");
      window.location.href = "login.html";
    }

    // Get current user
    const currentUser = JSON.parse(localStorage.getItem("loggedInUser") || "{}");
    let uploadedFile = null;

    // ======================================
    // LOAD CURRENT USER INFO
    // ======================================
    function loadCurrentUser() {
      if (currentUser.profile_pic && currentUser.profile_pic !== 'default.jpg') {
        document.getElementById("currentUserImage").src = 'backend/' + currentUser.profile_pic;
        document.getElementById("sidebarProfile").src = 'backend/' + currentUser.profile_pic;
      } else {
        const avatarUrl = `https://ui-avatars.com/api/?name=${currentUser.full_name || 'User'}&background=2563eb&color=ffffff`;
        document.getElementById("currentUserImage").src = avatarUrl;
        document.getElementById("sidebarProfile").src = avatarUrl;
      }
      document.getElementById("sidebarName").textContent = currentUser.full_name || currentUser.username;
      document.getElementById("sidebarUsername").textContent = "@" + currentUser.username;
    }

    // ======================================
    // API CALL HELPER
    // ======================================
    async function apiCall(endpoint, method = 'GET', data = null, isFile = false) {
      const options = {
        method: method,
        headers: {
          'Authorization': 'Bearer ' + token
        }
      };
      if (!isFile) {
        options.headers['Content-Type'] = 'application/json';
        if (data) options.body = JSON.stringify(data);
      } else {
        options.body = data;
      }
      try {
        const response = await fetch(`${API_URL}/${endpoint}`, options);
        return await response.json();
      } catch (error) {
        console.error('API Error:', error);
        return { success: false, message: 'Network error' };
      }
    }

    // ======================================
    // LOAD POSTS FROM BACKEND
    // ======================================
    let postsData = {};

    async function loadPosts() {
      const result = await apiCall('posts/get.php');
      const container = document.getElementById('postsContainer');
      
      if (!result.success || !result.posts) {
        container.innerHTML = '<p class="text-center text-slate-500 py-8">No posts yet. Be the first to post!</p>';
        return;
      }

      postsData = {};
      result.posts.forEach(p => postsData[p.id] = p);

      container.innerHTML = result.posts.map(post => {
        const profilePic = post.profile_pic && post.profile_pic !== 'default.jpg' 
          ? 'backend/' + post.profile_pic 
          : `https://ui-avatars.com/api/?name=${post.full_name}&background=2563eb&color=ffffff`;
        
        const postImage = post.image ? 'backend/' + post.image : '';
        const isOwnPost = String(post.user_id) === String(currentUser.id);
        const isPinned = Number(post.pinned) === 1;
        
        return `
          <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-sm p-5 mb-5 post-card ${isPinned ? 'ring-2 ring-blue-500' : ''}">
            ${isPinned ? `
              <div class="flex items-center gap-2 text-blue-600 text-xs font-semibold mb-3">
                <i class="fa-solid fa-thumbtack"></i> Pinned
              </div>
            ` : ''}
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <img src="${profilePic}" class="w-12 h-12 rounded-2xl object-cover">
                <div>
                  <h4 class="font-semibold">${post.full_name}</h4>
                  <p class="text-sm text-slate-500">@${post.username} • ${new Date(post.created_at).toLocaleString()}${post.updated_at ? ' • Edited' : ''}</p>
                </div>
              </div>
              ${isOwnPost ? `
                <div class="flex gap-3 text-slate-400">
                  <button onclick="startEditPost(${post.id})" title="Edit post" class="hover:text-blue-600 transition"><i class="fa-solid fa-pen"></i></button>
                  <button onclick="deletePost(${post.id})" title="Delete post" class="hover:text-red-600 transition"><i class="fa-solid fa-trash"></i></button>
                </div>
              ` : ''}
            </div>
            <div id="postBody-${post.id}">
              <p class="my-4">${post.content || ''}</p>
              ${postImage ? `<img src="${postImage}" class="rounded-2xl w-full max-h-96 object-cover mb-4">` : ''}
            </div>
            
            <!-- Like, Comment, Save & Share Buttons -->
            <div class="flex justify-between items-center mt-4 border-t border-slate-200 dark:border-slate-700 pt-4">
              <button onclick="toggleLike(${post.id})" class="flex items-center gap-2 ${post.user_liked ? 'text-red-500' : 'text-slate-500'} hover:text-red-500 transition font-semibold">
                ${post.user_liked ? '❤️' : '🤍'} <span>${post.like_count}</span>
              </button>
              <button onclick="showCommentBox(${post.id})" class="flex items-center gap-2 text-slate-500 hover:text-blue-500 transition font-semibold">
                💬 <span>${post.comment_count}</span>
              </button>
              <button id="saveBtn-${post.id}" onclick="toggleSave(${post.id})" class="flex items-center gap-2 ${post.is_saved > 0 ? 'text-green-600' : 'text-slate-500'} hover:text-green-600 transition font-semibold">
                <i class="fa-solid fa-bookmark"></i> <span>${post.is_saved > 0 ? 'Saved' : 'Save'}</span>
              </button>
              <button onclick="sharePost('${post.content || ''}')" class="text-blue-500 hover:text-blue-600 transition font-semibold">
                📤 Share
              </button>
            </div>

            <!-- Comment Section -->
            <div id="comments-${post.id}" class="mt-4 hidden">
              <div id="commentsList-${post.id}" class="space-y-2 mb-3"></div>
              <div class="flex gap-2">
                <input type="text" id="commentInput-${post.id}" placeholder="Write a comment..."
                       class="flex-1 bg-slate-100 dark:bg-slate-800 rounded-xl px-4 py-2 outline-none text-sm">
                <button onclick="addComment(${post.id})" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm">Post</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ======================================
    // HANDLE FILE UPLOAD
    // ======================================
    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      uploadedFile = file;
      
      const reader = new FileReader();
      reader.onload = function(ev) {
        const previewArea = document.getElementById('previewArea');
        previewArea.classList.remove('hidden');
        previewArea.innerHTML = `<img src="${ev.target.result}" class="h-32 rounded-2xl object-cover">`;
      };
      reader.readAsDataURL(file);
    }

    // ======================================
    // CREATE POST
    // ======================================
    async function createPost() {
      const input = document.getElementById('postInput');
      const text = input.value.trim();
      const btn = document.getElementById('createPostBtn');

      if (!text && !uploadedFile) {
        alert("Write something first!");
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Posting...';

      let result;
      if (uploadedFile) {
        const formData = new FormData();
        formData.append('content', text);
        formData.append('image', uploadedFile);
        result = await apiCall('posts/create.php', 'POST', formData, true);
      } else {
        result = await apiCall('posts/create.php', 'POST', { content: text });
      }

      if (result.success) {
        input.value = '';
        uploadedFile = null;
        document.getElementById('previewArea').classList.add('hidden');
        document.getElementById('previewArea').innerHTML = '';
        document.getElementById('photoUpload').value = '';
        loadPosts();
        loadSuggestedFriends();
      } else {
        alert(result.message);
      }

      btn.disabled = false;
      btn.textContent = 'Post';
    }

    // ======================================
    // EDIT / DELETE POST (own posts only)
    // ======================================
    function startEditPost(postId) {
      const post = postsData[postId];
      if (!post) return;
      const body = document.getElementById(`postBody-${postId}`);
      body.innerHTML = `
        <textarea id="editPostInput-${postId}" rows="3"
          class="w-full bg-slate-100 dark:bg-slate-800 rounded-2xl p-3 outline-none resize-none my-4">${post.content || ''}</textarea>
        <div class="flex gap-3 mb-4">
          <button onclick="saveEditPost(${postId})" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl text-sm font-medium">Save</button>
          <button onclick="loadPosts()" class="px-5 py-2 rounded-xl text-sm font-medium border dark:border-slate-700">Cancel</button>
        </div>
      `;
    }

    async function saveEditPost(postId) {
      const input = document.getElementById(`editPostInput-${postId}`);
      const content = input.value.trim();
      if (!content) {
        alert("Post can't be empty!");
        return;
      }
      const result = await apiCall('posts/update.php', 'POST', { post_id: postId, content });
      if (result.success) {
        loadPosts();
      } else {
        alert(result.message);
      }
    }

    async function deletePost(postId) {
      const ok = confirm("Delete this post? This can't be undone.");
      if (!ok) return;
      const result = await apiCall('posts/delete.php', 'POST', { post_id: postId });
      if (result.success) {
        loadPosts();
      } else {
        alert(result.message);
      }
    }

    // ======================================
    // TOGGLE LIKE
    // ======================================
    async function toggleLike(postId) {
      const result = await apiCall('posts/like.php', 'POST', { post_id: postId });
      if (result.success) loadPosts();
    }

    // ======================================
    // SHOW/HIDE COMMENT BOX
    // ======================================
    async function showCommentBox(postId) {
      const commentSection = document.getElementById(`comments-${postId}`);
      const isHidden = commentSection.classList.contains('hidden');
      
      if (isHidden) {
        commentSection.classList.remove('hidden');
        await loadComments(postId);
      } else {
        commentSection.classList.add('hidden');
      }
    }

    // ======================================
    // LOAD COMMENTS
    // ======================================
    let commentsData = {};

    async function loadComments(postId) {
      const result = await apiCall(`posts/comment.php?post_id=${postId}`);
      const container = document.getElementById(`commentsList-${postId}`);
      
      if (result.success && result.comments) {
        result.comments.forEach(c => commentsData[c.id] = c);

        container.innerHTML = result.comments.map(c => {
          const isOwnComment = String(c.user_id) === String(currentUser.id);
          return `
          <div class="bg-slate-100 dark:bg-slate-800 rounded-xl p-3" id="comment-${c.id}">
            <div class="flex items-center justify-between gap-2">
              <strong>@${c.username}</strong>
              ${isOwnComment ? `
                <div class="flex gap-2 text-slate-400 text-xs">
                  <button onclick="startEditComment(${postId}, ${c.id})" title="Edit comment" class="hover:text-blue-600 transition"><i class="fa-solid fa-pen"></i></button>
                  <button onclick="deleteComment(${postId}, ${c.id})" title="Delete comment" class="hover:text-red-600 transition"><i class="fa-solid fa-trash"></i></button>
                </div>
              ` : ''}
            </div>
            <div id="commentBody-${c.id}">
              <p class="text-sm">${c.comment}</p>
              <p class="text-xs text-slate-500 mt-1">${new Date(c.created_at).toLocaleString()}${c.updated_at ? ' • Edited' : ''}</p>
            </div>
          </div>
        `;
        }).join('');
      }
    }

    // ======================================
    // EDIT / DELETE COMMENT (own comments only)
    // ======================================
    function startEditComment(postId, commentId) {
      const c = commentsData[commentId];
      if (!c) return;
      const body = document.getElementById(`commentBody-${commentId}`);
      body.innerHTML = `
        <input type="text" id="editCommentInput-${commentId}" value="${c.comment.replace(/"/g, '&quot;')}"
          class="w-full bg-white dark:bg-slate-700 rounded-lg px-3 py-1.5 outline-none text-sm mt-1">
        <div class="flex gap-2 mt-2">
          <button onclick="saveEditComment(${postId}, ${commentId})" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-lg text-xs font-medium">Save</button>
          <button onclick="loadComments(${postId})" class="px-3 py-1 rounded-lg text-xs font-medium border dark:border-slate-600">Cancel</button>
        </div>
      `;
    }

    async function saveEditComment(postId, commentId) {
      const input = document.getElementById(`editCommentInput-${commentId}`);
      const comment = input.value.trim();
      if (!comment) {
        alert("Comment can't be empty!");
        return;
      }
      const result = await apiCall('posts/comment.php', 'POST', { action: 'edit', comment_id: commentId, comment });
      if (result.success) {
        loadComments(postId);
        loadPosts();
      } else {
        alert(result.message);
      }
    }

    async function deleteComment(postId, commentId) {
      const ok = confirm("Delete this comment?");
      if (!ok) return;
      const result = await apiCall('posts/comment.php', 'POST', { action: 'delete', comment_id: commentId });
      if (result.success) {
        loadComments(postId);
        loadPosts();
      } else {
        alert(result.message);
      }
    }

    // ======================================
    // ADD COMMENT
    // ======================================
    async function addComment(postId) {
      const input = document.getElementById(`commentInput-${postId}`);
      const text = input.value.trim();
      
      if (!text) {
        alert("Write a comment first!");
        return;
      }

      const result = await apiCall('posts/comment.php', 'POST', { post_id: postId, comment: text });
      
      if (result.success) {
        input.value = '';
        await loadComments(postId);
      } else {
        alert(result.message);
      }
    }

    // ======================================
    // SAVE / UNSAVE POST (backend-backed, per account)
    // ======================================
    async function toggleSave(postId) {
      const result = await apiCall('posts/save.php', 'POST', { post_id: postId });
      if (!result.success) {
        alert(result.message);
        return;
      }
      const btn = document.getElementById(`saveBtn-${postId}`);
      if (btn) {
        if (result.saved) {
          btn.classList.remove('text-slate-500');
          btn.classList.add('text-green-600');
          btn.querySelector('span').textContent = 'Saved';
        } else {
          btn.classList.remove('text-green-600');
          btn.classList.add('text-slate-500');
          btn.querySelector('span').textContent = 'Save';
        }
      }
      if (postsData[postId]) postsData[postId].is_saved = result.saved ? 1 : 0;
    }

    // ======================================
    // SHARE POST
    // ======================================
    function sharePost(content) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(content);
        alert("✅ Post copied successfully!");
      } else {
        prompt("Copy this post:", content);
      }
    }

    // ======================================
    // SEARCH USERS
    // ======================================
    async function searchUsers() {
      const keyword = document.getElementById("searchInput").value.trim();
      const results = document.getElementById("searchResults");
      results.innerHTML = "";

      if (keyword === "") return;

      const result = await apiCall(`users/search.php?q=${encodeURIComponent(keyword)}`);
      
      if (result.success && result.users) {
        if (result.users.length === 0) {
          results.innerHTML = '<p class="text-sm text-slate-500">No user found.</p>';
          return;
        }
        
        result.users.forEach(user => {
          results.innerHTML += `
            <div class="bg-slate-100 dark:bg-slate-800 rounded-xl p-3">
              <p class="font-semibold">${user.full_name}</p>
              <p class="text-sm text-slate-500">@${user.username}</p>
            </div>
          `;
        });
      }
    }

    // ======================================
    // LOAD SUGGESTED FRIENDS
    // ======================================
    async function loadSuggestedFriends() {
      const result = await apiCall('friends/suggestions.php');

      if (result.success && result.users) {
        // Update modal container (show all) — this is the ONLY place
        // suggested users are shown; nothing renders on the sidebar itself.
        const modalContainer = document.getElementById("suggestedFriendsContainer");
        if (modalContainer) {
          if (result.users.length === 0) {
            modalContainer.innerHTML = '<p class="text-slate-500 text-center col-span-full">No new suggestions right now.</p>';
            return;
          }

          modalContainer.innerHTML = result.users.map(user => `
            <div id="suggestedUser-${user.id}" class="bg-slate-100 dark:bg-slate-800 rounded-2xl p-4">
              <div onclick="window.location.href='profile.html?user_id=${user.id}'" class="flex items-center gap-3 cursor-pointer">
                <img src="${user.profile_pic && user.profile_pic !== 'default.jpg' ? 'backend/' + user.profile_pic : `https://ui-avatars.com/api/?name=${user.full_name}&background=2563eb&color=ffffff`}" 
                     class="w-12 h-12 rounded-xl object-cover">
                <div class="flex-1">
                  <h4 class="font-semibold">${user.full_name}</h4>
                  <p class="text-sm text-slate-500">@${user.username}</p>
                </div>
              </div>
              <button onclick="sendFriendRequest(${user.id}, this)" 
                      class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-sm font-medium">
                Add Friend
              </button>
            </div>
          `).join('');
        }
      }
    }

    // ======================================
    // MODAL FUNCTIONS
    // ======================================
    function showSuggestedFriendsModal() {
      document.getElementById("suggestedFriendsModal").classList.remove("hidden");
    }

    function closeSuggestedFriendsModal() {
      document.getElementById("suggestedFriendsModal").classList.add("hidden");
    }

    // Close modal when clicking outside
    document.getElementById("suggestedFriendsModal").addEventListener("click", function(e) {
      if (e.target === this) {
        closeSuggestedFriendsModal();
      }
    });

    // ======================================
    // SEND FRIEND REQUEST
    // ======================================
    async function sendFriendRequest(receiverId, btn) {
      const result = await apiCall('friends/send_request.php', 'POST', { receiver_id: receiverId });
      
      if (result.success) {
        btn.textContent = 'Request Sent ✓';
        btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
        btn.classList.add('bg-green-600');
        btn.disabled = true;
      } else {
        alert(result.message);
      }
    }

    // ======================================
    // LOAD NOTIFICATION COUNT
    // ======================================
    async function loadNotificationCount() {
      const result = await apiCall('notifications/get.php');
      const badge = document.getElementById("notif-count");
      
      if (result.success && result.unread_count > 0) {
        badge.classList.remove("hidden");
        badge.textContent = result.unread_count;
      } else {
        badge.classList.add("hidden");
      }
    }

    // ======================================
    // LOGOUT
    // ======================================
    function logout() {
      const ok = confirm("Are you sure you want to logout?");
      if (!ok) return;
      localStorage.removeItem("token");
      localStorage.removeItem("loggedInUser");
      window.location.href = "login.html";
    }

    // ======================================
    // INITIALIZE PAGE
    // ======================================
    loadCurrentUser();
    loadPosts();
    loadSuggestedFriends();
    loadNotificationCount();

    // Auto-refresh suggested friends and notifications every 10 seconds
    // This ensures new users appear immediately and notifications stay current
    setInterval(() => {
      loadSuggestedFriends();
      loadNotificationCount();
    }, 10000);
  </script>
</body>
</html>
