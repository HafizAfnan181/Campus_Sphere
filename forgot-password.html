<!DOCTYPE html>
<html lang="ur" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CampusSphere - Forgot Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <script>
    tailwind.config = {
      content: [],
      theme: { extend: {} }
    }
  </script>

  <style>
    .fade-in {
      animation: fadeIn .6s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-violet-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md mx-4">
    <div class="bg-white dark:bg-slate-900 rounded-2xl sm:rounded-3xl shadow-2xl overflow-hidden fade-in">

      <!-- Header -->
      <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 sm:p-8 text-white text-center">
        <h1 class="text-3xl sm:text-4xl font-bold">CampusSphere</h1>
        <p class="mt-1 sm:mt-2 opacity-90 text-sm sm:text-base">Apne Campus ki Duniya</p>
      </div>

      <div class="p-6 sm:p-8">
        <h2 class="text-xl sm:text-2xl font-semibold text-slate-800 dark:text-white text-center mb-2">Forgot Password</h2>
        <p class="text-slate-600 dark:text-slate-400 text-center mb-6 sm:mb-8 text-sm">
          Enter your username and the email you registered with, then set a new password.
        </p>

        <form id="resetForm" class="space-y-4 sm:space-y-6">
          <div id="messageBox" class="hidden rounded-xl sm:rounded-2xl p-3 sm:p-4 text-center font-semibold text-sm sm:text-base"></div>

          <!-- Username -->
          <div>
            <label class="block text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-400 mb-2">Username</label>
            <input type="text" id="username"
                   class="w-full px-4 sm:px-5 py-3 sm:py-4 rounded-xl sm:rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition text-sm sm:text-base"
                   placeholder="Enter your username" required>
          </div>

          <!-- Email -->
          <div>
            <label class="block text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-400 mb-2">Email Address</label>
            <input type="email" id="email"
                   class="w-full px-4 sm:px-5 py-3 sm:py-4 rounded-xl sm:rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition text-sm sm:text-base"
                   placeholder="Enter your email" required>
          </div>

          <!-- New Password -->
          <div>
            <label class="block text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-400 mb-2">New Password</label>
            <div class="relative">
              <input type="password" id="newPassword"
                     class="w-full px-4 sm:px-5 py-3 sm:py-4 rounded-xl sm:rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition text-sm sm:text-base"
                     placeholder="Enter new password" required>
              <i id="eye1" class="fa-solid fa-eye absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer hover:text-slate-600"></i>
            </div>
          </div>

          <!-- Confirm Password -->
          <div>
            <label class="block text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-400 mb-2">Confirm Password</label>
            <div class="relative">
              <input type="password" id="confirmPassword"
                     class="w-full px-4 sm:px-5 py-3 sm:py-4 rounded-xl sm:rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition text-sm sm:text-base"
                     placeholder="Confirm new password" required>
              <i id="eye2" class="fa-solid fa-eye absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer hover:text-slate-600"></i>
            </div>
          </div>

          <!-- Password Strength -->
          <div>
            <div class="w-full h-1.5 sm:h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
              <div id="strengthBar" class="h-full w-0 bg-red-500 transition-all duration-500"></div>
            </div>
            <p id="strengthText" class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1 sm:mt-2">Password Strength</p>
          </div>

          <button id="resetBtn" type="submit"
                  class="w-full bg-blue-600 hover:bg-blue-700 transition py-3 sm:py-4 rounded-xl sm:rounded-2xl text-white font-semibold text-base sm:text-lg shadow-lg shadow-blue-500/30">
            <span id="resetBtnText">Reset Password</span>
          </button>
        </form>
      </div>

      <!-- Back To Login -->
      <div class="text-center pb-6 sm:pb-8">
        <p class="text-slate-600 dark:text-slate-400 text-sm sm:text-base">
          Remember your password?
          <a href="login.html" class="text-blue-600 font-semibold hover:underline">Login Here</a>
        </p>
      </div>

    </div>

    <p class="text-center text-slate-500 dark:text-slate-400 text-xs sm:text-sm mt-4 sm:mt-6 px-4">
      © 2026 CampusSphere
      <br>
      <span class="text-blue-600">Secure Password Recovery System</span>
    </p>
  </div>

  <script>
    const API_URL = window.location.origin + '/social-site/backend/api';
    let resetting = false;

    function showMessage(message, type) {
      const box = document.getElementById("messageBox");
      box.classList.remove("hidden");
      box.className = type === "success"
        ? "bg-green-100 text-green-700 rounded-2xl p-4 text-center font-semibold mb-4"
        : "bg-red-100 text-red-700 rounded-2xl p-4 text-center font-semibold mb-4";
      box.innerHTML = message;
    }

    function togglePassword(inputId, eyeId) {
      const input = document.getElementById(inputId);
      const eye = document.getElementById(eyeId);
      if (input.type === "password") {
        input.type = "text";
        eye.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        eye.classList.replace("fa-eye-slash", "fa-eye");
      }
    }
    document.getElementById("eye1").onclick = () => togglePassword("newPassword", "eye1");
    document.getElementById("eye2").onclick = () => togglePassword("confirmPassword", "eye2");

    const passwordInput = document.getElementById("newPassword");
    passwordInput.addEventListener("input", function () {
      const password = this.value;
      const bar = document.getElementById("strengthBar");
      const text = document.getElementById("strengthText");
      let score = 0;
      if (password.length >= 6) score++;
      if (/[A-Z]/.test(password)) score++;
      if (/[a-z]/.test(password)) score++;
      if (/[0-9]/.test(password)) score++;
      if (/[^A-Za-z0-9]/.test(password)) score++;

      if (score <= 2) {
        bar.style.width = "30%"; bar.className = "h-full bg-red-500"; text.innerHTML = "Weak Password";
      } else if (score <= 4) {
        bar.style.width = "70%"; bar.className = "h-full bg-yellow-500"; text.innerHTML = "Medium Password";
      } else {
        bar.style.width = "100%"; bar.className = "h-full bg-green-500"; text.innerHTML = "Strong Password";
      }
    });

    document.getElementById("resetForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      if (resetting) return;
      resetting = true;

      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const newPassword = document.getElementById("newPassword").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();
      const btn = document.getElementById("resetBtn");
      const btnText = document.getElementById("resetBtnText");

      if (!username || !email || !newPassword || !confirmPassword) {
        showMessage("❌ Please fill all fields.", "error");
        resetting = false;
        return;
      }
      if (newPassword.length < 6) {
        showMessage("❌ Password must be at least 6 characters.", "error");
        resetting = false;
        return;
      }
      if (newPassword !== confirmPassword) {
        showMessage("❌ Passwords do not match.", "error");
        resetting = false;
        return;
      }

      btn.disabled = true;
      btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';

      try {
        const response = await fetch(`${API_URL}/auth/forgot_password.php`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, new_password: newPassword })
        });
        const result = await response.json();

        if (!result.success) {
          showMessage("❌ " + result.message, "error");
          btn.disabled = false;
          btnText.textContent = "Reset Password";
          resetting = false;
          return;
        }

        btn.classList.remove("bg-blue-600");
        btn.classList.add("bg-green-600");
        btnText.innerHTML = '<i class="fa-solid fa-circle-check"></i> Password Updated';
        showMessage("✅ Password changed successfully!", "success");

        setTimeout(() => {
          showMessage("🔄 Redirecting to Login...", "success");
          setTimeout(() => {
            resetting = false;
            window.location.href = "login.html";
          }, 1000);
        }, 1500);
      } catch (error) {
        console.error(error);
        showMessage("❌ Server error. Please try again.", "error");
        resetting = false;
        btn.disabled = false;
        btnText.textContent = "Reset Password";
      }
    });
  </script>

</body>
</html>
