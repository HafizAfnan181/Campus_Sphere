<!DOCTYPE html>
<html lang="ur" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusSphere • Explore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 dark:bg-slate-950">

  <!-- Navbar -->
  <nav class="bg-white dark:bg-slate-900 border-b sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row items-stretch sm:items-center gap-3 sm:gap-8">
      <h1 onclick="window.location.href='home.html'" class="text-2xl sm:text-3xl font-bold cursor-pointer text-center sm:text-left">
        <span class="text-blue-600">Campus</span>Sphere
      </h1>
      <div class="flex-1 sm:max-w-xl">
        <input type="text" id="searchInput" oninput="searchPeople()"
               placeholder="Search people by name or username..."
               class="w-full px-4 sm:px-6 py-3 sm:py-4 bg-slate-100 dark:bg-slate-800 rounded-3xl outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </div>
  </nav>

  <!-- Message Box -->
  <div id="messageBox" class="hidden fixed top-5 right-5 z-50 px-6 py-4 rounded-2xl text-white font-semibold shadow-2xl"></div>

  <div class="max-w-5xl mx-auto py-6 sm:py-8 px-4 sm:px-6">
    <!-- Trending Section -->
    <h2 class="text-2xl sm:text-3xl font-bold mb-6 sm:mb-8">🔥 Campus Trending</h2>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
      <div class="bg-white dark:bg-slate-900 rounded-3xl overflow-hidden shadow hover:shadow-lg transition cursor-pointer">
        <div class="h-52 bg-gradient-to-br from-pink-500 to-rose-500 flex items-center justify-center">
          <i class="fa-solid fa-code text-white text-6xl"></i>
        </div>
        <div class="p-5">
          <h3 class="font-bold text-lg">#FinalYearProject</h3>
          <p class="text-sm text-slate-500 mt-1">1.2k posts • Trending in CS Dept</p>
        </div>
      </div>
      
      <div class="bg-white dark:bg-slate-900 rounded-3xl overflow-hidden shadow hover:shadow-lg transition cursor-pointer">
        <div class="h-52 bg-gradient-to-br from-blue-500 to-cyan-500 flex items-center justify-center">
          <i class="fa-solid fa-graduation-cap text-white text-6xl"></i>
        </div>
        <div class="p-5">
          <h3 class="font-bold text-lg">#Convocation2026</h3>
          <p class="text-sm text-slate-500 mt-1">856 posts • University Events</p>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-900 rounded-3xl overflow-hidden shadow hover:shadow-lg transition cursor-pointer">
        <div class="h-52 bg-gradient-to-br from-purple-500 to-indigo-500 flex items-center justify-center">
          <i class="fa-solid fa-futbol text-white text-6xl"></i>
        </div>
        <div class="p-5">
          <h3 class="font-bold text-lg">#SportsFest</h3>
          <p class="text-sm text-slate-500 mt-1">2.1k posts • Sports Complex</p>
        </div>
      </div>
    </div>

    <!-- Discover People -->
    <h2 class="text-2xl sm:text-3xl font-bold mt-10 sm:mt-12 mb-6 flex flex-wrap gap-3 justify-between items-center">
      <span>Discover People</span>
      <span id="peopleCount" class="bg-blue-600 text-white px-4 py-2 rounded-full text-base">0</span>
    </h2>

    <div id="peopleContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6"></div>
  </div>

  <!-- Footer -->
  <footer class="mt-16 py-8 text-center text-slate-500 border-t dark:border-slate-700">
    <p>CampusSphere © 2026</p>
    <p class="mt-2 text-sm">Discover • Connect • Grow</p>
  </footer>

  <script>
    // ======================================
    // API CONFIGURATION
    // ======================================
    const API_URL = window.location.origin + '/social-site/backend/api';
    const token = localStorage.getItem("token");
    const currentUser = JSON.parse(localStorage.getItem("loggedInUser") || "{}");

    if (!token || !currentUser.id) {
      window.location.href = "login.html";
    }

    let allUsers = [];
    let sentRequests = new Set(); // Track request IDs

    // ======================================
    // API CALL HELPER
    // ======================================
    async function apiCall(endpoint, method = 'GET', data = null) {
      const options = {
        method: method,
        headers: {
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        }
      };
      if (data) options.body = JSON.stringify(data);

      try {
        const response = await fetch(`${API_URL}/${endpoint}`, options);
        return await response.json();
      } catch (error) {
        console.error('API Error:', error);
        return { success: false, message: 'Network error' };
      }
    }

    // ======================================
    // SHOW MESSAGE TOAST
    // ======================================
    function showMessage(text, color) {
      const box = document.getElementById("messageBox");
      box.className = `fixed top-5 right-5 z-50 px-6 py-4 rounded-2xl text-white font-semibold shadow-2xl bg-${color}-600 transition-all`;
      box.innerHTML = `<i class="fa-solid fa-circle-check mr-2"></i>${text}`;
      box.classList.remove("hidden");
      setTimeout(() => {
        box.classList.add("hidden");
      }, 2500);
    }

    // ======================================
    // SEARCH & LOAD PEOPLE
    // ======================================
    async function searchPeople() {
      const keyword = document.getElementById("searchInput").value.trim();
      const container = document.getElementById("peopleContainer");

      if (keyword === "") {
        container.innerHTML = `
          <div class="col-span-full text-center text-slate-500 py-10">
            <i class="fa-solid fa-search text-5xl mb-4 block"></i>
            Type to search users...
          </div>`;
        document.getElementById("peopleCount").textContent = "0";
        return;
      }

      // Show loading
      container.innerHTML = `
        <div class="col-span-full text-center py-10">
          <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-500"></i>
          <p class="mt-2 text-slate-500">Searching...</p>
        </div>`;

      const result = await apiCall(`users/search.php?q=${encodeURIComponent(keyword)}`);

      if (!result.success) {
        container.innerHTML = '<div class="col-span-full text-center text-slate-500 py-10">Error loading users</div>';
        document.getElementById("peopleCount").textContent = "0";
        return;
      }

      allUsers = result.users || [];
      document.getElementById("peopleCount").textContent = allUsers.length;

      if (allUsers.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center text-slate-500 py-10">
            <i class="fa-solid fa-user-slash text-5xl mb-4 block"></i>
            No users found
          </div>`;
        return;
      }

      renderPeople();
    }

    // ======================================
    // RENDER PEOPLE CARDS
    // ======================================
    function renderPeople() {
      const container = document.getElementById("peopleContainer");
      container.innerHTML = "";

      allUsers.forEach(user => {
        const profilePic = user.profile_pic && user.profile_pic !== 'default.jpg'
          ? 'backend/' + user.profile_pic
          : `https://ui-avatars.com/api/?name=${encodeURIComponent(user.full_name)}&background=2563eb&color=fff`;

        let buttonHTML = "";

        if (sentRequests.has(user.id)) {
          buttonHTML = `
            <button onclick="cancelFriendRequest(${user.id})"
                    class="bg-yellow-500 hover:bg-yellow-600 transition text-white px-4 py-2 rounded-xl w-full">
              <i class="fa-solid fa-clock mr-2"></i>Request Sent
            </button>`;
        } else {
          buttonHTML = `
            <button onclick="sendFriendRequest(${user.id})"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl transition w-full">
              <i class="fa-solid fa-user-plus mr-2"></i>Add Friend
            </button>`;
        }

        container.innerHTML += `
          <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 shadow hover:shadow-xl transition transform hover:scale-105">
            <img src="${profilePic}" class="w-24 h-24 rounded-full mx-auto object-cover border-4 border-blue-100 dark:border-slate-700">
            <h3 class="font-bold text-center mt-4 text-lg">${user.full_name}</h3>
            <p class="text-center text-slate-500 text-sm">@${user.username}</p>
            <div class="flex justify-center mt-5">
              ${buttonHTML}
            </div>
          </div>`;
      });
    }

    // ======================================
    // SEND FRIEND REQUEST
    // ======================================
    async function sendFriendRequest(userId) {
      if (userId == currentUser.id) {
        showMessage("You can't send request to yourself", "red");
        return;
      }

      const result = await apiCall('friends/send_request.php', 'POST', {
        receiver_id: userId
      });

      if (result.success) {
        sentRequests.add(userId);
        showMessage("Friend Request Sent! ✅", "green");
        renderPeople();
      } else {
        showMessage(result.message || "Error sending request", "red");
      }
    }

    // ======================================
    // CANCEL FRIEND REQUEST
    // ======================================
    async function cancelFriendRequest(userId) {
      // Note: Backend doesn't have cancel endpoint, so we just update UI
      // In production, you'd add a cancel API
      sentRequests.delete(userId);
      showMessage("Request Cancelled", "yellow");
      renderPeople();
    }

    // ======================================
    // INITIAL LOAD
    // ======================================
    // Load some default users on page load
    (async function init() {
      const result = await apiCall('users/search.php?q=');
      if (result.success && result.users) {
        allUsers = result.users;
        document.getElementById("peopleCount").textContent = allUsers.length;
        renderPeople();
      }
    })();
  </script>
</body>
</html>
