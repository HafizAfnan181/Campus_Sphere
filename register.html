<!DOCTYPE html>
<html lang="ur" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusSphere - Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  
  <script>
    // Password Toggle Function
    function togglePassword() {
      const pass1 = document.getElementById('password');
      const pass2 = document.getElementById('confirm-password');
      const icon1 = document.getElementById('eye1');
      const icon2 = document.getElementById('eye2');
      
      if (pass1.type === "password") {
        pass1.type = "text";
        pass2.type = "text";
        icon1.classList.replace('fa-eye', 'fa-eye-slash');
        icon2.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        pass1.type = "password";
        pass2.type = "password";
        icon1.classList.replace('fa-eye-slash', 'fa-eye');
        icon2.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-violet-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md sm:max-w-xl mx-4 sm:mx-6">
    <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl overflow-hidden">
      
      <!-- Header -->
      <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 sm:p-8 text-white text-center">
        <h1 class="text-3xl sm:text-4xl font-bold">CampusSphere</h1>
        <p class="mt-2 opacity-90">Join your campus community</p>
      </div>

      <!-- Form -->
      <div class="p-6 sm:p-8">
        <h2 class="text-xl sm:text-2xl font-semibold text-slate-800 dark:text-white text-center mb-8">Create New Account</h2>

        <form id="registerForm" class="space-y-5">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-2">First Name</label>
              <input type="text" id="firstName"
                     class="w-full px-4 sm:px-5 py-3 sm:py-4 rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:border-blue-500 outline-none transition" 
                     placeholder="" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-2">Last Name</label>
              <input type="text" id="lastName"
                     class="w-full px-4 sm:px-5 py-3 sm:py-4 rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:border-blue-500 outline-none transition" 
                     placeholder="" required>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-2">Email Address</label>
            <input type="email" id="email"
                   class="w-full px-4 sm:px-5 py-3 sm:py-4 rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:border-blue-500 outline-none transition" 
                   placeholder="your@email.com" required>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-2">Username</label>
            <input type="text" id="username"
                   class="w-full px-4 sm:px-5 py-3 sm:py-4 rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:border-blue-500 outline-none transition" 
                   placeholder="Alice123@" required>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-2">Password</label>
            <div class="relative">
              <input type="password" id="password" 
                     class="w-full px-4 sm:px-5 py-3 sm:py-4 rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:border-blue-500 outline-none transition" 
                     placeholder="Create password" required>
              <i id="eye1" onclick="togglePassword()" 
                 class="fa-solid fa-eye absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer"></i>
            </div>
            <p id="strengthText" class="mt-2 text-sm text-slate-500">Strength: -</p>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-2">Confirm Password</label>
            <div class="relative">
              <input type="password" id="confirm-password" 
                     class="w-full px-4 sm:px-5 py-3 sm:py-4 rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:border-blue-500 outline-none transition" 
                     placeholder="Confirm password" required>
              <i id="eye2" onclick="togglePassword()" 
                 class="fa-solid fa-eye absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer"></i>
            </div>
          </div>

          <button type="submit" id="registerBtn"
                  class="w-full bg-blue-600 hover:bg-blue-700 transition py-4 rounded-2xl text-white font-semibold text-base sm:text-lg mt-4 shadow-lg shadow-blue-500/30">
            <span id="btnText">Create Account</span>
          </button>
        </form>

        <div class="text-center mt-8">
          <p class="text-slate-600 dark:text-slate-400">
            Already have an account? 
            <a href="login.html" class="text-blue-600 font-semibold hover:underline">Login Here</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin + '/social-site/backend/api';

    // Password Strength Checker
    const pass = document.getElementById('password');
    const strength = document.getElementById('strengthText');
    
    pass.addEventListener('input', () => {
      const v = pass.value;
      let s = 'Weak';
      let color = 'text-red-500';
      
      if (v.length >= 8 && /[A-Z]/.test(v) && /\d/.test(v) && /[^A-Za-z0-9]/.test(v)) {
        s = 'Strong';
        color = 'text-green-500';
      } else if (v.length >= 6) {
        s = 'Medium';
        color = 'text-yellow-500';
      }
      
      strength.textContent = 'Strength: ' + s;
      strength.className = 'mt-2 text-sm ' + color;
    });

    // Form Submission
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      
      const btnText = document.getElementById('btnText');
      const registerBtn = document.getElementById('registerBtn');

      // Validation
      if (!firstName || !lastName || !email || !username || !password || !confirmPassword) {
        alert("❌ Please fill in all fields!");
        return;
      }

      if (password.length < 6) {
        alert("❌ Password must be at least 6 characters long!");
        return;
      }

      if (password !== confirmPassword) {
        alert("❌ Passwords do not match!");
        return;
      }

      if (!email.includes('@') || !email.includes('.')) {
        alert("❌ Please enter a valid email address!");
        return;
      }

      // Show loading
      btnText.textContent = "Creating Account...";
      registerBtn.disabled = true;
      registerBtn.classList.add('opacity-50');

      const full_name = firstName + ' ' + lastName;

      try {
        const response = await fetch(`${API_URL}/auth/register.php`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: username,
            email: email,
            password: password,
            full_name: full_name
          })
        });

        const result = await response.json();

        if (!result.success) {
          alert("❌ " + result.message);
          btnText.textContent = "Create Account";
          registerBtn.disabled = false;
          registerBtn.classList.remove('opacity-50');
          return;
        }

        // Save email + code so verify-email.html can auto-fill it —
        // no email is sent anymore, the code travels with the browser instead.
        localStorage.setItem("verify_email", email);
        localStorage.setItem("verify_code", result.verification_code);

        window.location.href = "verify-email.html";

      } catch(error) {
        console.error("Registration Error:", error);
        alert("❌ Cannot connect to server. Please check if XAMPP is running!");
        btnText.textContent = "Create Account";
        registerBtn.disabled = false;
        registerBtn.classList.remove('opacity-50');
      }
    });
  </script>
</body>
</html>
